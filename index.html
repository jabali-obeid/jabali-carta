<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta QR - Jabalí</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Banner Reseña -->
        <a href="https://maps.app.goo.gl/3cimkMsdgdtfZPni6" target="_blank" rel="noopener noreferrer" class="review-banner">
            <div class="review-banner-left">
                <div class="review-header-row">
                    <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span class="review-stars">⭐⭐⭐⭐⭐</span>
                </div>
                <span class="review-text">¡No olvides dejar tu reseña! 💕✨</span>
            </div>
            <div class="review-banner-btn">
                <span>Dejar reseña</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </div>
        </a>

        <header>
            <div class="header-brand">
                <div class="logo-container">
                    <img src="logo.png" alt="Jabalí Logo" class="brand-logo">
                </div>
                <h1 class="logo">JABALÍ</h1>
            </div>
            <p class="subtitle">Elegí una de las tres barras</p>
        </header>

        <nav class="category-nav">
            <button class="nav-btn active" data-target="pizzeria">Pizzería</button>
            <button class="nav-btn" data-target="hamburgueseria">Hamburguesería</button>
            <button class="nav-btn" data-target="tragos">Tragos</button>
        </nav>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Buscar plato, trago o bebida..." autocomplete="off">
        </div>

        <div class="diet-filters">
            <button class="diet-btn active" data-filter="all">Todos</button>
            <button class="diet-btn" data-filter="vegano">🌱 Vegano</button>
            <button class="diet-btn" data-filter="sin-alcohol">🚫 Sin Alcohol</button>
        </div>

        <main class="menu-content">
            <div id="menu-root"></div>
        </main>

        <!-- Back to top button -->
        <button id="backToTopBtn" title="Volver arriba">↑</button>

        <!-- Developer footer -->
        <footer class="dev-footer">
            <p class="dev-credit">⚡ Carta digital desarrollada por <strong>Nicolás Gómez</strong></p>
            <a href="https://instagram.com/nicogomezp10" target="_blank" rel="noopener noreferrer"
                class="dev-instagram">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                </svg>
                @nicogomezp10
            </a>
            <span class="dev-tagline">¿Querés una carta QR para tu negocio? ¡Escribime!</span>
        </footer>

    </div>
    <script src="app.js"></script>

</body>

</html>
